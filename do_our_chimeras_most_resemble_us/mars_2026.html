<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="stylesheet" type="text/css" href="style.css"> 
<link rel="stylesheet" type="text/css" href="titre-svg-wave.css">
<link rel="stylesheet" type="text/css" href="style_mobile.css">

<script src="titre-svg-data.js" defer></script>

  <span id="logo-kadist" data-h="2.3vh"></span>

<div id="boite_calendar">

    <div id="calendar-artists-nav"></div>
  </div>
  <div id="calendar-panel">
    <div id="calendar-content"></div>
  </div>

   <button id="calendar-close-mobile">retour</button> 
</div>

<!-- Header buttons -->

<div id="top-right-buttons">
  <div style="display:flex;align-items:center;gap:15px;">
<button id="btn_cine_switch" class="nav_link info3 btn_hover">
  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 73.29 73.29">
    <circle cx="36.65" cy="36.65" r="34.15" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="5"/>
    <path d="M36.65,70.79c-18.86,0-34.15-15.29-34.15-34.15S17.79,2.5,36.65,2.5V70.79Z" fill="currentColor"/>
  </svg>
</button>
        <button id="btn-lang" class="btn_hover">→fr</button>
  </div>
  <button id="btn_home" class="nav_link btn_hover">exhibition entrance</button>
</div>

<div id="header-buttons" style="position:fixed;top:50px;right:50px;z-index:2000;display:flex;align-items:center;gap:10px;">
    <div id="about">
  <div id="boite_about">
    <span id="about-label">about</span>
    <div id="about-panel">
 <div id="about-content">
</div>
    </div>
  </div>

              <button id="about-close-mobile">close</button>
</div>
  <div style="display:none ;width:15px;height:15px;border-radius:50%;background:linear-gradient(90deg,black 50%,white 50%);border:1px solid white;"></div>
</div>




<!-- PART 1 : Titre wave -->
<div class="editor" id="editor">
  <div id="desktop-wave-lines"></div>
</div>
<!-- ══════════════════════════════════════════════
     MOBILE ONLY 
     ══════════════════════════════════════════════ -->

<div class="editor-mobile" id="editor-mobile">
  <div id="mobile-wave-lines"></div>
</div>



<!-- PART 1 : Carrousel artistes -->
<div id="artistes-container" style="width:100vw;bottom:30px;padding-left:20px;box-sizing:border-box;position:fixed;">
<div class="carrousel-wrapper vitesse-9" id="carrousel"></div>
</div>


<div id="hover-previews"></div>




<!-- PART 2 -->
<div id="titre-haut">Do Our Chimeras Most Resemble Us?</div>


<div id="part_3">
<div id="mask-bas"></div>
<div id="gauche">

  <div id="mask-texte-oeuvre">

      <div id="texte-oeuvre" class="info1"></div>
    </div>
  </div>

<img class="video-hover-preview" id="video-hover-preview-2" alt="">

          <div id="timeline-fullscreen-fill"></div>

    </div>
  </div>

  <div id="list_artist" class=" btn_hover info3">artists</div>
  <div id="fullscreen" class="bas btn_hover">fullscreen</div>
