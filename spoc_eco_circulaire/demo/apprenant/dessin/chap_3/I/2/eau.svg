<svg xmlns="http://www.w3.org/2000/svg" width="245.11" height="523.57" viewBox="0 0 245.11 523.57" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* cycle de 6 s : l'eau est calme, la goutte tombe, l'eau s'agite puis se calme */
    .goutte { transform-box: view-box; animation: goutte 6s infinite; }
    .eau_agitee { transform-box: view-box; transform-origin: 0 236.6px; transform: scaleY(0.01);
                  animation: eau_agitee 6s infinite; }
    .eau_vague { animation: eau_vague 0.7s linear infinite; }

    @keyframes goutte {
      0%, 15% { transform: translateY(0); opacity: 1; animation-timing-function: ease-in; }
      28%     { transform: translateY(88px); opacity: 1; }
      30%     { transform: translateY(95px); opacity: 0; }
      92%     { transform: translateY(0); opacity: 0; }
      100%    { transform: translateY(0); opacity: 1; }
    }
    @keyframes eau_agitee {
      0%, 28% { transform: scaleY(0.01); }
      34%     { transform: scaleY(1); }
      55%     { transform: scaleY(0.8); }
      80%     { transform: scaleY(0.3); }
      95%, 100% { transform: scaleY(0.01); }
    }
    @keyframes eau_vague { from { transform: translateX(0); } to { transform: translateX(50px); } }

    @media (prefers-reduced-motion: reduce) {
      .goutte, .eau_agitee, .eau_vague { animation: none; }
    }
  </style>
  <path class="rose_pale trait_fin" d="M208.89,326.52v81.7s.51,9.19-25.53,9.19h-49.02v104.16H2.6l31.66-118.46v-66.38c0-22.98,12.25-35.74,35.74-35.74h74.81c4.67,0,8.38,3.85,8.28,8.52-.2,9.38-2.55,23.13-14.67,23.13h-55.15"/>
