  <style>
    /* cycle de 6 s : le verre baisse par gorgées, les bulles montent dans le cola */
    .niveau_verre { animation: boire 6s ease-in-out infinite; }
    @keyframes boire {
      0%, 15%   { transform: none; }
      25%, 40%  { transform: translateY(17px); }
      50%, 65%  { transform: translateY(34px); }
      75%, 100% { transform: translateY(50px); }
    }
    .bulle { animation: bulle 1.8s ease-in infinite; }
    @keyframes bulle { from { transform: translateY(0); } to { transform: translateY(-80px); } }
    .goutte { transform-box: fill-box; transform-origin: center; animation: petille 2.4s ease-out infinite; opacity: 0; }
    @keyframes petille { 0% { opacity: 0; transform: translateY(30px) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px) scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
