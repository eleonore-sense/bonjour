<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deviens le héros de ton projet d’éco-conception !</title>

  <!-- LE PONT SCORM 2004
       C'est la page que Moodle ouvre (dans imsmanifest.xml : href="scorm.html").
       Elle se présente à Moodle une seule fois, puis affiche les pages du cours en dessous,
       dans un cadre qui prend toute la place. L'étudiant ne la voit pas.
       Les pages lui confient les réponses (memoire.js), elle les range dans Moodle.
       Réglages : en haut de scorm.js. -->

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    #contenu {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>

  <script src="scorm.js" defer></script>
</head>

<body>
  <iframe id="contenu" title="Activité : deviens le héros de ton projet d’éco-conception"></iframe>
</body>
</html>
