<script>

  var tour = 1;

  function lancer_tour(){
$(".photo").css("display", "none");
$("#voeu").css("display", "none");
$("#encore").css("display", "none");
if (tour == 1) {
$("#notice").css("display", "block");
}
$(".tour" + tour).css("display", "block");
$(".tour" + tour + " .bougie").removeClass("eteinte agitee").data("souffle", 0);
  }

  function flamme_eteinte(){
$("#notice").css("display", "none");
$("#voeu").css("display", "block");
if (tour < 3) {
$("#encore").css("display", "block");
}
  }

  $("#encore").click(function(){
tour++;
if (tour > 3) { tour = 1; }
lancer_tour();
  });

  lancer_tour();


  var sx = 0;
  var sy = 0;
  var st = 0;

  $(document).mousemove(function(e){
var vitesse = (Math.abs(e.pageX - sx) + Math.abs(e.pageY - sy)) / Math.max(e.timeStamp - st, 1);
sx = e.pageX;
sy = e.pageY;
st = e.timeStamp;


$(".bougie:visible").not(".eteinte").each(function(){
var r = this.getBoundingClientRect();
var dx = e.clientX - (r.left + r.width / 2);
var dy = e.clientY - (r.top + r.height / 2);
var distance = Math.sqrt(dx * dx + dy * dy);
if (distance < 120 && vitesse > 1.5) {
$(this).data("souffle", ($(this).data("souffle") || 0) + 1);
if ($(this).data("souffle") > 6) {
$(this).removeClass("agitee").addClass("eteinte");
if ($(".bougie:visible").not(".eteinte").length == 0) {
setTimeout(flamme_eteinte, 900);
}
}
} else if (distance < 100) {
$(this).addClass("agitee");
} else {
$(this).removeClass("agitee");
}
});
  });

</script>
